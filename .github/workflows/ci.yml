name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
      - run: dotnet restore RvtIO.slnx
      - run: dotnet build RvtIO.slnx -c Release --no-restore
      - run: dotnet test RvtIO.slnx -c Release --no-build
      - run: dotnet pack RvtIO.slnx -c Release --no-build -o artifacts
      - run: dotnet build src/RvtIO/RvtIO.csproj -c Release -p:BuildNativeCoreOnly=true --artifacts-path native-core-check
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*.nupkg
          if-no-files-found: error
